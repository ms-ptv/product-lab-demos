<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Metro</title>
<style>
  :root { --bg: #f4f3ee; --ink: #2e2e2e; --muted: #9a978c; --panel: #ffffffe6; --line: #e2dfd4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: default; }
  .hud { position: fixed; display: flex; gap: 6px; align-items: center; }
  #stats, #legend, #tools { text-shadow: 0 0 5px #f4f3ee, 0 0 3px #f4f3ee; }
  #stats { top: 14px; left: 20px; gap: 26px; align-items: baseline; }
  #stats b { font-size: 30px; font-weight: 300; letter-spacing: -.5px; }
  #stats small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  #tools { top: 12px; right: 14px; }
  #city { top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; }
  #city > button { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 7px 12px 7px 14px; font: 500 13px/1 inherit; color: var(--ink); cursor: pointer; }
  #city > button:hover { background: #fff; }
  #city svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #cityMenu { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); min-width: 250px; background: #fff;
    border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 8px 24px #0002; display: none; }
  #cityMenu .ci { padding: 8px 12px; border-radius: 9px; cursor: pointer; display: flex; justify-content: space-between; gap: 14px; }
  #cityMenu .ci:hover { background: #0000000a; }
  #cityMenu .ci.on { font-weight: 600; }
  #cityMenu small { display: block; padding: 8px 12px 4px; color: var(--muted); font-size: 11px; line-height: 1.4; border-top: 1px solid var(--line); margin-top: 4px; }
  #cityMenu code { font-size: 10px; background: #0000000a; padding: 1px 4px; border-radius: 4px; }
  #bottom { bottom: 14px; left: 50%; transform: translateX(-50%); gap: 10px; }
  .btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
    border: 0; background: transparent; color: var(--ink); cursor: pointer; padding: 0; }
  .btn:hover { background: #0000000f; }
  .btn.on { background: var(--ink); color: #fff; }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .btn.sm { width: 24px; height: 24px; background: var(--panel); border: 1px solid var(--line); }
  .btn.sm svg { width: 12px; height: 12px; }
  .chip { display: flex; align-items: center; gap: 3px; }
  .chip .dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; color: #fff;
    font-weight: 700; font-size: 12px; display: grid; place-items: center; opacity: .25; }
  .chip.used .dot { opacity: 1; }
  .chip.sel .dot { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
  .chip .ctl { display: none; grid-template-columns: 24px 24px; gap: 2px; }
  .chip.used .ctl { display: grid; }
  #pool, #cost { display: flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; }
  #cost small, #pool small { color: var(--muted); font-weight: 400; }
  #legend { left: 20px; top: 84px; flex-direction: column; align-items: flex-start; gap: 2px; }
  #legend .it { display: flex; align-items: center; gap: 9px; padding: 4px 8px 4px 4px; border-radius: 14px; cursor: pointer; color: var(--muted); }
  #legend .it:hover { background: #0000000a; }
  #legend .it.on { background: var(--ink); color: #fff; }
  #legend svg { width: 16px; height: 16px; }
  #legend small { color: var(--muted); margin: 6px 0 0 4px; font-size: 11px; }
  #tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; box-shadow: 0 6px 20px #0002; display: none; min-width: 250px; z-index: 5; }
  #tip h4 { margin: 0 0 2px; font-size: 14px; }
  #tip .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #tip .bar { height: 6px; border-radius: 3px; background: #2e2e2e; }
  #tip .lbl { width: 76px; color: var(--muted); }
  #tip .val { width: 74px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  #toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ink);
    color: #fff; padding: 8px 14px; border-radius: 20px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, 150px); text-align: center;
    color: var(--muted); pointer-events: none; transition: opacity .6s; }
  #modal { position: fixed; inset: 0; background: #0006; display: none; place-items: center; z-index: 10; }
  #modal .card { background: #fff; border-radius: 16px; padding: 22px 24px; width: min(440px, 92vw);
    box-shadow: 0 10px 40px #0004; max-height: 92vh; overflow: auto; }
  #modal h2 { margin: 0 0 4px; font-size: 18px; }
  #modal p.sub { margin: 0 0 14px; color: var(--muted); }
  #modal table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  #modal td { padding: 6px 0; border-bottom: 1px solid #eee; }
  #modal td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #modal tr.total td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); font-size: 15px; }
  #modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  #modal .actions .btn { width: auto; border-radius: 19px; padding: 0 16px; background: #0000000f; }
  #foot { position: fixed; left: 20px; bottom: 12px; color: var(--muted); font-size: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="stats" class="hud">
  <span><b id="sScore">0</b><small>arrived</small></span>
  <span><b id="sWeek">1</b><small>week</small></span>
  <span><b id="sStations">1</b><small>stops</small></span>
</div>

<div id="city" class="hud"><button id="bCity" type="button" title="Choose a city"><span id="cityName"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div id="cityMenu"></div></div>

<div id="tools" class="hud">
  <button class="btn" id="bPause" title="Pause (space bar)"></button>
  <button class="btn" id="bSpeed" title="Speed"></button>
  <button class="btn" id="bHeat" title="Show demand on the map"></button>
  <button class="btn" id="bPlan" title="Planning mode: crowding does not end the game"></button>
  <button class="btn" id="bProp" title="Propose a network"></button>
  <button class="btn" id="bSum" title="Summary and costs"></button>
  <button class="btn" id="bNew" title="Restart"></button>
</div>

<div id="legend" class="hud"></div>

<div id="bottom" class="hud">
  <div id="chips" style="display:flex;gap:6px"></div>
  <div id="pool"></div>
  <div id="cost"></div>
</div>

<div id="prop" class="hud" style="display:none;top:64px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:4px 6px 4px 18px;gap:8px;z-index:4">
  <span id="propTxt" style="font-weight:600"></span>
  <button class="btn" id="propOk" title="Build the proposal"></button>
  <button class="btn" id="propNo" title="Discard (Esc)"></button>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="hint">Drag from one stop to the next to build a line.<br>Click a line to edit it. Drag a line end onto its other end to close a ring.</div>
<div id="foot"></div>
<div id="modal"><div class="card" id="card"></div></div>

<script src="data/cities.js" onerror="window.CITIES = window.CITIES || []"></script>
<script>
// City selection: ?city=<id>, else the last one used, else the first built city
(function () {
  var list = window.CITIES || [], id = new URLSearchParams(location.search).get("city");
  try { if (!id) id = localStorage.getItem("metroCity"); } catch (e) {}
  if (!list.some(function (c) { return c.id === id; })) id = list.some(function (c) { return c.id === "karlsruhe"; }) ? "karlsruhe" : (list.length ? list[0].id : "karlsruhe");
  window.CITY_ID = id;
  document.write('<script src="data/' + id + '.js"><\/script><script src="data/' + id + '-roads.js" onerror="window.CITY_ROADS = null"><\/script>');
})();
</script>
<script>
"use strict";
/* ============================================================ Configuration */
// Costs are kept simple on purpose. CFG.cost can later be replaced by a custom cost function.
const CFG = {
  cost: {
    perKm: 30,        // € million per km of track
    bridgePerM: 1.5,  // € million surcharge per metre of water crossed
    station: 20,      // € million per stop
    train: 5,         // € million per vehicle
    corridor(route, c) { return route.len / 1000 * c.perKm + route.bridgeLen * c.bridgePerM; },
  },
  trainSpeed: 320,     // m/s Simulationszeit
  trainCap: 8,
  stationCap: 10,
  overcrowdSec: 40,
  coverRadius: 800,    // catchment of a stop (m)
  minStationDist: 1000,
  catchRadius: 600,
  startTrains: 3,
  weekSec: 45,
  maxLines: 6,
  followStreets: true,                    // lines follow the real street network when it is available
  unlocked: { rail: true, tram: true },   // transport modes available; more (bus, ...) can be unlocked later
  paxRate: 0.05,       // passengers per second and stop at average activity
  spawnGap: 40,        // Sekunden zwischen neuen Halten am Anfang
  spawnGapMin: 20,     // lower limit, shrinks by 0.5 s with every stop
  growthSec: 500,      // demand grows by 100 % in this time
};
/* Categories: every shape stands for an interest. The data decide where they occur. */
const TYPES = D_cats();
function D_cats() { return (window.CITY_DATA && window.CITY_DATA.cats) || ["R", "W", "E", "B", "F"]; }
const CAT = {
  R: { name: "Home", glyph: "●", unit: "residents", col: [224, 123, 57] },
  W: { name: "Work", glyph: "▲", unit: "jobs", col: [70, 110, 170] },
  E: { name: "Shopping", glyph: "■", unit: "points", col: [190, 70, 130] },
  B: { name: "Education", glyph: "◆", unit: "points", col: [60, 150, 90] },
  F: { name: "Leisure", glyph: "⬟", unit: "points", col: [40, 150, 160] },
};
// Trip purposes: who wants to go where (shares per row, weighted with the real data)
const TRIP = {
  R: { R: .05, W: .40, E: .25, B: .12, F: .18 },
  W: { R: .45, W: .05, E: .25, B: .05, F: .20 },
  E: { R: .50, W: .10, E: .05, B: .05, F: .30 },
  B: { R: .50, W: .10, E: .15, B: .05, F: .20 },
  F: { R: .55, W: .10, E: .20, B: .05, F: .10 },
};
// small categories (education, leisure) have high location quotients everywhere, so they are damped slightly
const LOCAL_BIAS = { R: 1.25, W: 1.05, E: 0.9, B: 0.8, F: 1.0 };
const ACT_W = { R: .45, W: .25, E: .12, B: .08, F: .10 };   // weight of each category in the activity
const COLORS = ["#e5413c", "#2b7be4", "#3aa655", "#f2b630", "#8b5cc9", "#f28c28"];

/* ============================================================ Data */
const D = window.CITY_DATA;
const NX = D.nx, NY = D.ny, CELL = D.cell, MINX = D.minx, MINY = D.miny;
const tot = D.totals;
const cellIdx = (i, j) => j * NX + i;
const raw = {}, norm = {};
TYPES.forEach(c => { raw[c] = new Float32Array(NX * NY); norm[c] = new Float32Array(NX * NY); });
for (const row of D.cells) { const k = cellIdx(row[0], row[1]); TYPES.forEach((c, n) => { raw[c][k] = row[2 + n]; }); }
// normalised to city total = 1 so the categories are comparable
TYPES.forEach(c => { const t = tot[c] || 1; for (let k = 0; k < NX * NY; k++) norm[c][k] = raw[c][k] / t; });
const cellAct = new Float32Array(NX * NY);
for (let k = 0; k < NX * NY; k++) cellAct[k] = TYPES.reduce((a, c) => a + ACT_W[c] * norm[c][k], 0);
const cx = (i) => MINX + (i + 0.5) * CELL, cy = (j) => MINY + (j + 0.5) * CELL;

// smoothed activity (for the emergence of stops)
function smoothGrid(src, rad) {
  const out = new Float32Array(NX * NY), rc = Math.ceil(rad / CELL);
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    let s = 0;
    for (let dj = -rc; dj <= rc; dj++) for (let di = -rc; di <= rc; di++) {
      const a = i + di, b = j + dj;
      if (a < 0 || b < 0 || a >= NX || b >= NY) continue;
      if (Math.hypot(di, dj) * CELL <= rad) s += src[cellIdx(a, b)];
    }
    out[cellIdx(i, j)] = s;
  }
  return out;
}
const actSm = smoothGrid(cellAct, CFG.catchRadius);
const refAct = (() => { const v = Array.from(actSm).filter(x => x > 0).sort((a, b) => a - b); return v[Math.floor(v.length * 0.9)] || 1e-6; })();

// Real stop points (OSM). Stations can only appear at stops that exist and whose mode is unlocked.
const STOPS = (D.stops || []).map(([x, y, name, mode]) => {
  const i = Math.floor((x - MINX) / CELL), j = Math.floor((y - MINY) / CELL);
  const inb = i >= 0 && j >= 0 && i < NX && j < NY;
  return { x, y, name, mode, act: inb ? actSm[cellIdx(i, j)] : 0, used: false };
});
const stopOpen = (st) => CFG.unlocked[st.mode] && !st.used;

/* ============================================================ Water mask */
const WM = 8; // m pro Pixel
const wmW = Math.ceil((D.bounds[2] - D.bounds[0]) / WM), wmH = Math.ceil((D.bounds[3] - D.bounds[1]) / WM);
const waterCanvas = document.createElement("canvas");
waterCanvas.width = wmW; waterCanvas.height = wmH;
const wctx = waterCanvas.getContext("2d", { willReadFrequently: true });
const wx = (x) => (x - D.bounds[0]) / WM, wy = (y) => (D.bounds[3] - y) / WM;
wctx.fillStyle = "#4a90b8";
wctx.beginPath();
for (const ring of D.water.rings) {
  ring.forEach(([x, y], i) => i ? wctx.lineTo(wx(x), wy(y)) : wctx.moveTo(wx(x), wy(y)));
  wctx.closePath();
}
wctx.fill("evenodd");
wctx.strokeStyle = "#4a90b8"; wctx.lineCap = "round"; wctx.lineJoin = "round";
for (const [wd, pts] of D.water.lines) {
  wctx.lineWidth = Math.max(2, wd / WM);
  wctx.beginPath();
  pts.forEach(([x, y], i) => i ? wctx.lineTo(wx(x), wy(y)) : wctx.moveTo(wx(x), wy(y)));
  wctx.stroke();
}
const wData = wctx.getImageData(0, 0, wmW, wmH).data;
function isWater(x, y) {
  const i = Math.floor(wx(x)), j = Math.floor(wy(y));
  if (i < 0 || j < 0 || i >= wmW || j >= wmH) return false;
  return wData[(j * wmW + i) * 4 + 3] > 100;
}
// water layer (only used as a mask for bridge costs, the basemap shows the water)
const waterVis = document.createElement("canvas");
waterVis.width = wmW; waterVis.height = wmH;
(() => {
  const g = waterVis.getContext("2d"), im = g.createImageData(wmW, wmH);
  for (let k = 0; k < wmW * wmH; k++) {
    if (wData[k * 4 + 3] > 100) { im.data[k * 4] = 207; im.data[k * 4 + 1] = 226; im.data[k * 4 + 2] = 236; im.data[k * 4 + 3] = 255; }
  }
  g.putImageData(im, 0, 0);
})();
// demand maps: total and per category
const heat = {};
function makeHeat(arr, col, gain) {
  const cv = document.createElement("canvas"); cv.width = NX; cv.height = NY;
  const g = cv.getContext("2d"), im = g.createImageData(NX, NY);
  const v = Array.from(arr).filter(x => x > 0).sort((a, b) => a - b), top = v[Math.floor(v.length * 0.95)] || 1e-9;
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const t = Math.min(1, Math.sqrt(arr[cellIdx(i, j)] / (top * gain)));
    const p = ((NY - 1 - j) * NX + i) * 4;
    im.data[p] = col[0]; im.data[p + 1] = col[1]; im.data[p + 2] = col[2]; im.data[p + 3] = Math.round(t * 170);
  }
  g.putImageData(im, 0, 0); return cv;
}
heat.all = makeHeat(cellAct, [222, 110, 60], 1);
TYPES.forEach(c => { heat[c] = makeHeat(norm[c], CAT[c].col, 1); });

/* ============================================================ State */
let S; // Spielzustand
function newGame() {
  S = {
    t: 0, speed: 1, paused: false, over: false, plan: S ? S.plan : false, heat: S ? S.heat : null,
    stations: [], lines: [], pool: CFG.startTrains, score: 0, scoreBy: Object.fromEntries(TYPES.map(c => [c, 0])),
    week: 1, lastSpawn: 0, sd: new Float32Array(STOPS.length), netVer: 0,
    corridors: new Map(),          // key -> {route, count}
    spent: { track: 0, bridge: 0, station: 0, train: 0, bridges: 0, km: 0, bridgeM: 0, stations: 0, trains: 0 },
    drag: null, hover: null, nextId: 1, builtStations: new Set(), sel: null,
  };
  clearRoutes();
  STOPS.forEach(s => { s.used = false; });
  let hi = -1, hd = 600;
  STOPS.forEach((s, k) => { const d = Math.hypot(s.x - D.hbf[0], s.y - D.hbf[1]); if (d < hd) { hd = d; hi = k; } });
  const hs = hi >= 0 ? STOPS[hi] : null;
  addStation(hs ? hs.x : D.hbf[0], hs ? hs.y : D.hbf[1], "E", D.hbf[2] || "Main station", true, hs); // main station = centre / shopping
  for (let n = 0; n < 2; n++) trySpawnStation(true);
  S.lastSpawn = 0;
  buildChips(); refreshHud(); closeModal(); clearProposal();
  document.getElementById("hint").style.opacity = 1;
}

/* ---------- Stations */
function localShares(x, y, rad) {
  const rc = Math.ceil(rad / CELL), ci = Math.floor((x - MINX) / CELL), cj = Math.floor((y - MINY) / CELL);
  const sh = Object.fromEntries(TYPES.map(c => [c, 0])); let n = 0;
  for (let dj = -rc; dj <= rc; dj++) for (let di = -rc; di <= rc; di++) {
    const a = ci + di, b = cj + dj;
    if (a < 0 || b < 0 || a >= NX || b >= NY || Math.hypot(di, dj) * CELL > rad) continue;
    n++; const k = cellIdx(a, b);
    for (const c of TYPES) sh[c] += norm[c][k];
  }
  return { sh, n };
}
// The shape follows the area: residential gives a circle, industry and offices a triangle, centre a square, etc.
// The measure is the location quotient: share of the category here compared with the city average.
function localType(x, y, rad) {
  const { sh, n } = localShares(x, y, rad), avg = 1 / (NX * NY);
  let best = "R", bv = -1;
  for (const c of TYPES) {
    const lq = n ? sh[c] / (n * avg) : 0;
    const sc = Math.log(1 + Math.min(lq, 12)) * LOCAL_BIAS[c];
    if (sc > bv) { bv = sc; best = c; }
  }
  return best;
}
function wishMix(x, y, type) {
  // trip purpose (from where to where) times supply: how much of each category is within reach (gravity)
  const m = Object.fromEntries(TYPES.map(c => [c, 0]));
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const k = cellIdx(i, j);
    const d = Math.hypot(cx(i) - x, cy(j) - y);
    if (d < 500) continue;
    const f = 1 / (1 + (d / 2500) ** 2);
    for (const c of TYPES) m[c] += norm[c][k] * f;
  }
  let sum = 0;
  for (const c of TYPES) { m[c] *= (TRIP[type] || TRIP.R)[c]; sum += m[c]; }
  for (const c of TYPES) m[c] = sum ? m[c] / sum : 1 / TYPES.length;
  return m;
}
function nearestPlace(x, y) {
  let best = null, bd = 1e12;
  for (const p of D.places) { const d = Math.hypot(p[0] - x, p[1] - y) * (1 + p[3] * 0.0); if (d < bd) { bd = d; best = p; } }
  return best && bd < 3500 ? best[2] : "";
}
function addStation(x, y, type, name, hbf, stop) {
  if (stop) stop.used = true;
  const ci = Math.floor((x - MINX) / CELL), cj = Math.floor((y - MINY) / CELL);
  const st = {
    id: S.nextId++, x, y, type, name: name || (stop && stop.name) || nearestPlace(x, y), hbf: !!hbf,
    pax: [], timer: 0, born: S.t, spawnAcc: Math.random() * 3,
    act: ci >= 0 && cj >= 0 && ci < NX && cj < NY ? actSm[cellIdx(ci, cj)] : 0,
    mix: wishMix(x, y, type),
  };
  if (hbf) st.act = Math.max(st.act, refAct * 1.6);
  S.stations.push(st);
  S.netVer++;
  return st;
}
// The open stop with the highest built-up demand that keeps its distance to existing stations
function pickDemandStop(minD) {
  let best = -1, bd = minD;
  STOPS.forEach((st, k) => {
    if (!stopOpen(st) || st.act <= 0 || S.sd[k] <= bd) return;
    if (S.stations.some(s => Math.hypot(s.x - st.x, s.y - st.y) < CFG.minStationDist)) return;
    best = k; bd = S.sd[k];
  });
  return best < 0 ? null : { k: best, d: bd };
}
const DEMAND_NEEDED = 10; // demand that has to build up at a stop before it opens
function trySpawnStation(force) {
  const hb = S.stations[0]; let best = -1;
  if (!force) { const c = pickDemandStop(DEMAND_NEEDED); if (c) best = c.k; }
  else {
    // start phase: the busiest stops near the main station, preferably with a shape that does not exist yet
    const have = new Set(S.stations.map(s => s.type));
    for (const wantNew of [true, false]) {
      let bd = 0;
      STOPS.forEach((st, k) => {
        if (!stopOpen(st) || st.act <= bd) return;
        const dh = Math.hypot(st.x - hb.x, st.y - hb.y);

    tr.pax.forEach((pp, k) => { shape(pp.want, -11 + (k % 4) * 7.4, -4 + Math.floor(k / 4) * 8, 2.8); g.fill(); });
    g.restore();
  }
  // Kostenvorschau beim Ziehen
  if (dr && dr.moved && dr.target) {
    let cost = 0; const pairs = dr.mode === "insert" ? [[dr.line.stops[dr.idx - 1], dr.target.id], [dr.target.id, dr.line.stops[dr.idx % dr.line.stops.length]]] : [[dr.from.id, dr.target.id]];
    let br = 0;
    for (const [a, b] of pairs) { const route = getRoute(a, b), c = S.corridors.get(route.key); if (!(c && c.count > 0)) { cost += corridorCost(route); br += route.bridgeLen; } }
    for (const s of dr.mode === "insert" ? [dr.target] : [dr.from, dr.target]) if (!S.builtStations.has(s.id)) cost += CFG.cost.station;
    g.font = "600 12px -apple-system, sans-serif"; g.textAlign = "left";
    const txt = `+ €${fmt(cost)}M${br ? ` · bridge ${Math.round(br)} m` : ""}`;
    g.lineWidth = 4; g.strokeStyle = BG; g.strokeText(txt, dr.px + 16, dr.py - 12);
    g.fillStyle = INK; g.fillText(txt, dr.px + 16, dr.py - 12);
  }
}
const fmt = (v) => Math.round(v).toLocaleString("en-US");

/* ============================================================ Input */
function hitStation(px, py) {
  let best = null, bd = 22;
  for (const st of S.stations) { const d = Math.hypot(sx(st.x) - px, sy(st.y) - py); if (d < bd) { bd = d; best = st; } }
  return best;
}
let pan = null;
cv.addEventListener("pointerdown", (e) => {
  if (S.over) return;
  cv.setPointerCapture(e.pointerId);
  const px = e.clientX, py = e.clientY, sel = selLine();
  document.getElementById("hint").style.opacity = 0;
  if (sel) {
    const bd = badgesOf(sel).find(b => Math.hypot(b.x - px, b.y - py) <= 10);
    if (bd) { const nm = stationById(sel.stops[bd.k]).name || "Stop"; removeStop(sel, bd.k); toast(`${nm} detached from the line`); return; }
    const mh = handlesOf(sel).find(h => Math.hypot(h.x - px, h.y - py) <= 11);
    if (mh) { S.drag = { mode: "insert", line: sel, idx: mh.seg + 1, from: null, fromPt: [mh.wx, mh.wy], px, py, target: null, moved: false }; return; }
  }
  const st = hitStation(px, py);
  if (st) {
    let line = null, atEnd = true;
    if (!e.shiftKey) {
      const order = sel ? [sel, ...S.lines.filter(l => l !== sel)] : S.lines;
      for (const L of order) {
        if (L.loop) continue;
        if (L.stops[L.stops.length - 1] === st.id) { line = L; atEnd = true; break; }
        if (L.stops[0] === st.id) { line = L; atEnd = false; break; }
      }
    }
    S.drag = { mode: line ? "extend" : "new", from: st, fromPt: [st.x, st.y], line, atEnd, px, py, target: null, moved: false };
  } else pan = { x: px, y: py, moved: false, line: lineAt(px, py) };
});
cv.addEventListener("pointermove", (e) => {
  const px = e.clientX, py = e.clientY;
  if (S.drag) {
    const dr = S.drag; dr.px = px; dr.py = py;
    if (Math.hypot(px - sx(dr.fromPt[0]), py - sy(dr.fromPt[1])) > 8) dr.moved = true;
    const t = hitStation(px, py); dr.target = t && t !== dr.from ? t : null;
    hideTip(); return;
  }
  if (pan) {
    if (!pan.moved && Math.hypot(px - pan.x, py - pan.y) < 4) return;
    pan.moved = true; userCam = true;
    cam.cx -= (px - pan.x) / cam.s; cam.cy += (py - pan.y) / cam.s; pan.x = px; pan.y = py; return;
  }
  const st = hitStation(px, py); S.hover = st;
  const sel = selLine();
  const onGrip = sel && (badgesOf(sel).some(b => Math.hypot(b.x - px, b.y - py) <= 10) || handlesOf(sel).some(h => Math.hypot(h.x - px, h.y - py) <= 11));
  cv.style.cursor = st || onGrip || lineAt(px, py) ? "pointer" : "default";
  st ? showTip(st, px, py) : hideTip();
});
cv.addEventListener("pointerup", (e) => {
  if (pan) { // click without dragging: select a line or clear the selection
    if (!pan.moved) { S.sel = pan.line ? pan.line.id : null; buildChips(); }
    pan = null; return;
  }
  const dr = S.drag; S.drag = null; if (!dr || !dr.moved) return;
  const t = hitStation(e.clientX, e.clientY); if (!t || t === dr.from) return;
  const L = dr.line;
  if (dr.mode === "insert") {
    if (L.stops.includes(t.id)) toast("This stop is already on the line");
    else insertStop(L, dr.idx, t.id);
    return;
  }
  if (L) {
    const nb = dr.atEnd ? L.stops[L.stops.length - 2] : L.stops[1];
    const other = dr.atEnd ? L.stops[0] : L.stops[L.stops.length - 1];
    if (t.id === nb) retractLine(L, dr.atEnd);
    else if (t.id === other && L.stops.length >= 3) closeLoop(L);
    else if (L.stops.includes(t.id)) toast("This stop is already on the line");
    else extendLine(L, dr.atEnd, t.id);
  } else { const nl = createLine(dr.from.id, t.id); if (nl) { S.sel = nl.id; buildChips(); } }
});
cv.addEventListener("wheel", (e) => {
  e.preventDefault(); userCam = true;
  const k = Math.exp(-e.deltaY * 0.0015), mx = wxs(e.clientX), my = wys(e.clientY);
  cam.s = Math.min(0.8, Math.max(0.02, cam.s * k));
  cam.cx = mx - (e.clientX - W / 2) / cam.s; cam.cy = my + (e.clientY - H / 2) / cam.s;
}, { passive: false });
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  if (e.code === "Escape") { clearProposal(); S.sel = null; buildChips(); }
  if ((e.code === "Delete" || e.code === "Backspace") && selLine()) { deleteLine(selLine()); toast("Line deleted"); }
});

/* ============================================================ Tooltip, toast */
const tip = document.getElementById("tip");
function showTip(st, px, py) {
  const { sh } = localShares(st.x, st.y, CFG.catchRadius);
  const rn = Math.round(sh.R * tot.R), wn = Math.round(sh.W * tot.W);
  const pc = (v) => (v * 100).toFixed(1) + " %";
  tip.innerHTML = `<h4>${st.hbf ? "★ " : ""}${st.name || "Stop"} <span style="font-weight:400;color:#9a978c">${CAT[st.type].glyph} ${CAT[st.type].name}</span></h4>
   <div style="color:#9a978c;margin-bottom:6px">≈ ${fmt(rn)} residents · ${fmt(wn)} jobs within ${CFG.catchRadius} m</div>
   <div class="row" style="color:#9a978c;font-size:11px"><span class="lbl"></span><span class="val">Area*</span><span>Passengers want to go to</span></div>` +
    TYPES.map(c => `<div class="row"><span class="lbl">${CAT[c].glyph} ${CAT[c].name}</span><span class="val">${pc(sh[c])}</span><span class="bar" style="width:${Math.round(st.mix[c] * 70)}px"></span>${Math.round(st.mix[c] * 100)} %</div>`).join("") +
    `<div style="margin-top:6px;color:#9a978c;font-size:11px">*share of the whole city · Waiting: ${st.pax.length} / ${CFG.stationCap}</div>`;
  tip.style.display = "block";
  tip.style.left = Math.min(W - 280, px + 18) + "px"; tip.style.top = Math.min(H - 230, py + 14) + "px";
}
function hideTip() { tip.style.display = "none"; }
let toastT;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200);
}

/* ============================================================ HUD */
const ICON = {
  pause: '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>',
  speed: (n) => `<svg viewBox="0 0 24 24">${[0, 1, 2].slice(0, n).map(i => `<path d="M${5 + i * 5} 6l5 6-5 6"/>`).join("")}</svg>`,
  heat: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>',
  plan: '<svg viewBox="0 0 24 24"><path d="M12 12c-1.5-2-3-3-4.5-3a3 3 0 0 0 0 6c1.5 0 3-1 4.5-3zm0 0c1.5 2 3 3 4.5 3a3 3 0 0 0 0-6c-1.5 0-3 1-4.5 3z"/></svg>',
  wand: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16v4M17 18h4"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  sum: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5a3.5 3.5 0 1 0 0 5M8 11h5M8 13h5"/></svg>',
  neu: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>',
  minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  train: '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect x="5" y="4" width="14" height="13" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/></svg>',
};
const $ = (id) => document.getElementById(id);
function syncTools() {
  $("bPause").innerHTML = S.paused ? ICON.play : ICON.pause; $("bPause").classList.toggle("on", S.paused);
  $("bSpeed").innerHTML = ICON.speed(S.speed === 1 ? 1 : S.speed === 2 ? 2 : 3);
  $("bHeat").classList.toggle("on", S.heat === "all"); $("bPlan").classList.toggle("on", S.plan);
  document.querySelectorAll("#legend .it").forEach(el => el.classList.toggle("on", S.heat === el.dataset.c));
}
function togglePause() { if (S.over) return; S.paused = !S.paused; syncTools(); }
$("bPause").onclick = togglePause;
$("bSpeed").onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; syncTools(); };
$("bHeat").innerHTML = ICON.heat; $("bHeat").onclick = () => { S.heat = S.heat ? null : "all"; syncTools(); };
$("bPlan").innerHTML = ICON.plan; $("bPlan").onclick = () => { S.plan = !S.plan; toast(S.plan ? "Planning mode: crowding does not end the game" : "Game mode: crowding ends the game"); syncTools(); };
$("bProp").innerHTML = ICON.wand; $("bProp").onclick = () => proposeNetwork();
$("propOk").innerHTML = ICON.check; $("propOk").onclick = acceptProposal;
$("propNo").innerHTML = ICON.x; $("propNo").onclick = clearProposal;
$("bSum").innerHTML = ICON.sum; $("bSum").onclick = () => showSummary("Summary", false);
$("bNew").innerHTML = ICON.neu; $("bNew").onclick = () => { clearRoutes(); newGame(); syncTools(); };

function buildChips() {
  const box = $("chips"); box.innerHTML = "";
  COLORS.slice(0, CFG.maxLines).forEach((col, i) => {
    const L = S.lines.find(l => l.color === col);
    const el = document.createElement("div"); el.className = "chip" + (L ? " used" : "") + (L && S.sel === L.id ? " sel" : "");
    el.innerHTML = `<div class="dot" style="background:${col}" title="${L ? "Line " + (i + 1) + " (click to select)" : "Free line slot"}">${L ? L.trains.length : ""}</div>
      <div class="ctl"><button class="btn sm" title="Add a vehicle (from the depot)">${ICON.plus}</button><button class="btn sm" title="Remove a vehicle (keeps the line)">${ICON.minus}</button><button class="btn sm" title="Delete the whole line">${ICON.x}</button></div>`;
    if (L) {
      const [bp, bm, bx] = el.querySelectorAll("button");
      bm.onclick = () => { if (L.trains.length) { removeTrain(L); buildChips(); refreshHud(); } else toast("No vehicle on this line"); };
      el.querySelector(".dot").onclick = () => { S.sel = S.sel === L.id ? null : L.id; buildChips(); };
      bp.onclick = () => { if (S.pool > 0) { S.pool--; addTrain(L); buildChips(); refreshHud(); } else toast("No vehicle in the depot. One more arrives every week."); };
      bx.onclick = () => deleteLine(L);
    }
    box.appendChild(el);
  });
}
let lastHud = -1;
function refreshHud() {
  $("sScore").textContent = S.score; $("sWeek").textContent = S.week; $("sStations").textContent = S.stations.length;
  $("pool").innerHTML = `${ICON.train}<span>${S.pool}</span><small>in depot</small>`;
  const c = netCostNow();
  $("cost").innerHTML = `<span>€${fmt(c.total)}M</span><small>network today</small>`;
}
function showSummary(title, over) {
  const c = netCostNow(), sp = S.spent;
  const track = c.km * CFG.cost.perKm, bridge = c.bridgeM * CFG.cost.bridgePerM;
  const spentTotal = sp.track + sp.bridge + sp.station + sp.train;
  const per = S.score ? c.total / S.score : 0;
  $("card").innerHTML = `<h2>${title}</h2>
   <p class="sub">Week ${S.week} · ${S.score} passengers arrived (${TYPES.map(c => `${CAT[c].name} ${S.scoreBy[c]}`).join(", ")})</p>
   <table>
    <tr><td>Track · ${c.km.toFixed(1)} km</td><td>€${fmt(track)}M</td></tr>
    <tr><td>Bridges · ${c.bridges} (${fmt(c.bridgeM)} m of water crossed)</td><td>€${fmt(bridge)}M</td></tr>
    <tr><td>Stops · ${c.stations}</td><td>€${fmt(c.stations * CFG.cost.station)}M</td></tr>
    <tr><td>Vehicles · ${c.trains}</td><td>€${fmt(c.trains * CFG.cost.train)}M</td></tr>
    <tr class="total"><td>Network today</td><td>€${fmt(c.total)}M</td></tr>
   </table>
   <p class="sub">Built in total, including what was removed: €${fmt(spentTotal)}M${S.score ? ` · €${per.toFixed(2)}M network value per passenger arrived` : ""}</p>
   <div class="actions">
     ${over ? '<button class="btn" id="mCont">Continue in planning mode</button>' : '<button class="btn" id="mClose">Close</button>'}
     <button class="btn" id="mNew">New game</button>
   </div>`;
  $("modal").style.display = "grid";
  if (over) $("mCont").onclick = () => { S.over = false; S.plan = true; S.paused = false; S.stations.forEach(s => s.timer = 0); closeModal(); syncTools(); };
  else $("mClose").onclick = closeModal;
  $("mNew").onclick = () => { clearRoutes(); newGame(); syncTools(); };
}
function closeModal() { $("modal").style.display = "none"; }
$("modal").addEventListener("pointerdown", (e) => { if (e.target === $("modal") && !S.over) closeModal(); });
// City picker: lists every city that was built into data/ (data/cities.js)
const CITY_LIST = window.CITIES && window.CITIES.length ? window.CITIES : [{ id: window.CITY_ID, title: D.title || D.name }];
const curCity = CITY_LIST.find(c => c.id === window.CITY_ID) || CITY_LIST[0];
$("cityName").textContent = D.title || curCity.title; document.title = "Mini Metro · " + (D.title || curCity.title);
$("cityMenu").innerHTML = CITY_LIST.map(c => `<div class="ci${c.id === curCity.id ? " on" : ""}" data-id="${c.id}"><span>${c.title}</span>${c.id === curCity.id ? "●" : ""}</div>`).join("")
  + '<small>Another city: run <code>build_data.py --name &lt;id&gt; --title &lt;Name&gt; --bbox &lt;south,west,north,east&gt;</code>. It appears here automatically.</small>';
$("bCity").onclick = (e) => { e.stopPropagation(); const m = $("cityMenu"); m.style.display = m.style.display === "block" ? "none" : "block"; };
addEventListener("pointerdown", (e) => { if (!$("city").contains(e.target)) $("cityMenu").style.display = "none"; });
$("cityMenu").querySelectorAll(".ci").forEach(el => el.onclick = () => {
  if (el.dataset.id === curCity.id) { $("cityMenu").style.display = "none"; return; }
  try { localStorage.setItem("metroCity", el.dataset.id); } catch (e) {}
  location.search = "?city=" + el.dataset.id;
});
const SVGSH = { R: '<circle cx="8" cy="8" r="6"/>', W: '<polygon points="8,1.5 14.5,13.5 1.5,13.5"/>', E: '<rect x="2.5" y="2.5" width="11" height="11"/>', B: '<polygon points="8,1 15,8 8,15 1,8"/>', F: '<polygon points="8,1.2 14.8,6.2 12.2,14.2 3.8,14.2 1.2,6.2"/>' };
$("legend").innerHTML = TYPES.map(c => `<div class="it" data-c="${c}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">${SVGSH[c]}</svg>${CAT[c].name}</div>`).join("") + "<small>Click to show the demand</small>";
$("legend").querySelectorAll(".it").forEach(el => el.onclick = () => { S.heat = S.heat === el.dataset.c ? null : el.dataset.c; syncTools(); });
$("foot").textContent = D.sources + " · Basemap: Esri, HERE, Garmin · " + D.name;

/* ============================================================ Loop */
let last = performance.now(), hudAcc = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (!S.paused && !S.over) {
    let rest = real * S.speed;
    while (rest > 0 && !S.over) { const d = Math.min(0.05, rest); step(d); rest -= d; }
  }
  autoCam(real);
  hudAcc += real; if (hudAcc > 0.25) { hudAcc = 0; refreshHud(); }
  draw();
  requestAnimationFrame(frame);
}
newGame(); syncTools();
requestAnimationFrame(frame);
</script>
