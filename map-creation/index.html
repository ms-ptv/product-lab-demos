<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route visualization</title>
<style>
  :root { --bg:#e9ecf3; --ink:#1d2236; --muted:#6b7390; --accent:#1f2bff; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; color:var(--ink); }
  canvas { display:block; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .pill { position:fixed; padding:8px 12px; border-radius:10px; font-size:12px; color:var(--muted);
    background:rgba(255,253,249,.88); box-shadow:0 4px 16px rgba(31,43,120,.08); }
  #hud { position:fixed; left:12px; top:12px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; max-width:calc(100vw - 24px); }
  #bench { display:flex; flex-wrap:wrap; align-items:center; gap:2px; }
  #bench, #lenses { padding:4px; border-radius:14px; background:rgba(255,253,249,.94); box-shadow:0 4px 16px rgba(31,43,120,.12), 0 1px 2px rgba(31,43,120,.08); }
  #tools { display:flex; flex-wrap:wrap; align-items:center; gap:2px; }
  #bench .sep { width:1px; height:22px; margin:0 4px; background:#dfe2ee; }
  /* Ein Tastensystem für alles: 40 px Raster (Fitts: große, gleich große Ziele), 10 px Radius, gleiche Zustände überall */
  :root { --btn:40px; --tint:#e9ebff; --hover:#eef0f6; }
  .tg, .slot, .sp { position:relative; flex:none; width:var(--btn); height:var(--btn); padding:0; border:0; border-radius:10px; background:transparent; color:#8b92ad; cursor:pointer; display:grid; place-items:center; text-decoration:none; font:inherit; }
  .tg[hidden] { display:none; }
  .tg svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .sp svg { fill:currentColor; }
  .tg:hover, .slot:hover, .sp:hover { background:var(--hover); } .tg.on, .slot.on, .sp.on { color:var(--accent); background:var(--tint); }
  .tg:focus-visible, .slot:focus-visible, .sp:focus-visible, .menu button:focus-visible, .lw .x:focus-visible { outline:3px solid #9aa2ff; outline-offset:1px; }
  .tg kbd { position:absolute; right:4px; bottom:2px; font:600 9px ui-monospace,Menlo,monospace; color:inherit; opacity:.5; pointer-events:none; }
  .tg.forced::after { content:""; position:absolute; right:6px; top:6px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
  #lenses { display:flex; gap:2px; }
  .lw { position:relative; flex:none; }
  .slot b { font:700 17px ui-monospace,Menlo,monospace; }
  .lw .x { position:absolute; right:-2px; top:-2px; width:18px; height:18px; padding:0; border:0; border-radius:50%; background:#fff; color:var(--muted); box-shadow:0 1px 4px rgba(31,43,120,.3); cursor:pointer; display:grid; place-items:center; opacity:0; pointer-events:none; }
  .lw .x svg { width:10px; height:10px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; }
  .lw:hover .x, .lw:focus-within .x { opacity:1; pointer-events:auto; } .lw .x:hover { background:#d6453d; color:#fff; }
  .menu input[type=text], .menu input[type=date] { margin:2px 6px; padding:6px 8px; border:1px solid #c9cee0; border-radius:8px; font:600 13px inherit; color:var(--ink); background:#fff; }
  .menu .grp { height:1px; margin:4px 6px; background:#e3e6f1; } .menu button.sub { padding-left:20px; font-weight:500; }
  .menu { position:fixed; z-index:40; min-width:190px; padding:4px; border-radius:12px; background:rgba(255,253,249,.98); box-shadow:0 8px 24px rgba(31,43,120,.2), 0 1px 2px rgba(31,43,120,.1); display:flex; flex-direction:column; }
  .menu[hidden] { display:none; } .menu button { display:flex; align-items:center; gap:10px; height:36px; padding:0 10px; border:0; border-radius:8px; background:transparent; color:var(--ink); font:600 13px inherit; cursor:pointer; text-align:left; }
  .menu button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; } .menu button:hover:not(:disabled) { background:#eef0f6; } .menu button:disabled { color:#a3a9c0; cursor:default; }
  .menu button[aria-checked="true"] { color:var(--accent); } .menu button small { margin-left:auto; font-weight:400; color:var(--muted); font-size:11px; } .menu button[aria-checked="true"]::after { content:"✓"; margin-left:auto; }
  #rpanel { position:fixed; right:0; top:12px; bottom:calc(var(--tl, 150px) + 12px); width:var(--rpw, 320px); max-width:60vw; display:flex; flex-direction:column; border-radius:18px 0 0 18px; background:rgba(255,253,249,.96); box-shadow:-8px 0 24px rgba(31,43,120,.14), -1px 0 2px rgba(31,43,120,.10); }
  #rpanel[hidden] { display:none; }
  #rp-grip { position:absolute; left:0; top:0; bottom:0; width:12px; cursor:ew-resize; touch-action:none; border-radius:18px 0 0 18px; display:grid; place-items:center; } #rp-grip::before { content:""; width:4px; height:40px; border-radius:2px; background:#c3c8dc; } #rp-grip:hover::before, #rp-grip:focus-visible::before { background:var(--accent); } #rp-grip:focus-visible { outline:3px solid #9aa2ff; outline-offset:-3px; }
  #rp-head { display:flex; align-items:center; padding:12px 14px 6px 22px; font-weight:600; font-size:14px; } #rp-body { flex:1; overflow:auto; padding:4px 14px 14px 22px; color:var(--muted); font-size:13px; line-height:1.4; }
  #timeline { box-sizing:border-box; position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; max-height:92vh; padding:0 16px max(12px, env(safe-area-inset-bottom)); border-radius:18px 18px 0 0; background:rgba(255,253,249,.96); box-shadow:0 -8px 24px rgba(31,43,120,.14), 0 -1px 2px rgba(31,43,120,.10); }
  #timeline.sized { height:min(var(--tlH), 92vh); }
  #timeline > * { flex:none; }
  #tl-head { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
  #clock { font:600 20px ui-monospace,Menlo,monospace; letter-spacing:.02em; min-width:62px; }
  #speed { display:flex; gap:2px; }
  #tl-body { display:flex; gap:10px; }
  :root { --lw:320px; }
  @media (max-width:900px) { :root { --lw:250px; } .vol { width:44px; } }
  #tl-labels { width:var(--lw); flex:none; padding-top:26px; font-size:12px; color:var(--muted); }
  #tl-labels span { display:block; height:28px; line-height:28px; margin-bottom:4px; }
  #tl-track { position:relative; flex:1; height:62px; cursor:col-resize; touch-action:none; }
  #tl-canvas { position:absolute; inset:0; width:100%; height:100%; }
  #tl-modes { display:flex; gap:2px; flex-wrap:wrap; align-items:center; } #tl-zoom { margin-left:auto; display:flex; gap:2px; } .tg:disabled { opacity:.35; cursor:default; } .tg:disabled:hover { background:transparent; }
  .tg .bd { position:absolute; right:3px; top:3px; min-width:14px; height:14px; padding:0 3px; box-sizing:border-box; border-radius:7px; background:var(--accent); color:#fff; font:700 9px/14px inherit; text-align:center; pointer-events:none; }
  .tg.warn.on { background:#fde8e6; color:#d6453d; } .tg.warn .bd { background:#d6453d; }
  #timeline.nt #tl-track { height:34px; } #timeline.nt #tl-labels span { display:none; }
  #tl-grip { height:22px; margin:0 -16px 2px; cursor:ns-resize; touch-action:none; display:grid; place-items:center; border-radius:18px 18px 0 0; } #tl-grip::before { content:""; width:48px; height:5px; border-radius:3px; background:#c3c8dc; } #tl-grip:hover::before, #tl-grip:focus-visible::before { background:var(--accent); } #tl-grip:focus-visible { outline:3px solid #9aa2ff; outline-offset:-3px; }
  #tl-lines { margin-top:6px; max-height:26vh; overflow:auto; border-top:1px solid #e1e4ee; scroll-snap-type:y mandatory; }
  #timeline.sized #tl-lines { flex:1 1 0; min-height:0; max-height:none; }
  #tl-tip { position:fixed; z-index:30; max-width:300px; padding:8px 10px; border-radius:10px; background:var(--ink); color:#fff; font-size:12px; line-height:1.35; pointer-events:none; box-shadow:0 6px 18px rgba(0,0,0,.25); } #tl-tip[hidden] { display:none; } #tl-tip b { display:block; } #tl-tip small { opacity:.8; display:block; margin-top:2px; }
  #tl-lines[hidden] { display:none; }
  .lnwrap { display:flex; gap:10px; }
  #ln-labels { width:var(--lw); flex:none; }
  /* Spurkopf nach dem Vorbild von Soundtrap: Karte mit Farbbalken, Fahrzeug-Symbol, Titel, Stumm, Solo, Transparenz, Menü; unten ein Griff für die Höhe */
  .trk { scroll-snap-align:start; cursor:pointer; box-sizing:border-box; padding:2px 0; position:relative; font-size:12px; color:var(--ink); }
  .tc { position:relative; display:flex; align-items:flex-start; gap:8px; height:100%; box-sizing:border-box; padding:1px 6px 0 14px; border-radius:10px; background:#fff; border:1px solid #e3e6f1; overflow:hidden; }
  .trk:hover .tc { border-color:#c3c8dc; } .trk.sel .tc { box-shadow:0 0 0 2px var(--accent); border-color:var(--accent); }
  .tc .bar { position:absolute; left:0; top:0; bottom:0; width:6px; }
  .vic { flex:none; width:28px; height:28px; margin-top:3px; border-radius:50%; background:#eef0f6; color:var(--ink); display:grid; place-items:center; } .vic svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .tt { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-start; padding-top:3px; line-height:1.25; } .tt b { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tt small { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trk.over .tt b::after { content:" ●"; color:#d6453d; font-size:9px; } .trk.cold .tt b::after { content:" ●"; color:#3b82f6; font-size:9px; } .trk.over.cold .tt b::after { content:" ●●"; color:#d6453d; }
  .ctl { flex:none; display:flex; align-items:center; gap:4px; }
  .tb { width:32px; height:32px; padding:0; border:0; border-radius:10px; background:transparent; color:#8b92ad; cursor:pointer; display:grid; place-items:center; } .tb svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tb:hover { background:var(--hover); } .tb:focus-visible, .vol:focus-visible { outline:3px solid #9aa2ff; outline-offset:1px; }
  .tb[data-act="mute"].on { background:#fde8e6; color:#d6453d; } .tb[data-act="solo"].on { background:#fff1c2; color:#8a5a00; }
  .vol { -webkit-appearance:none; appearance:none; width:64px; height:32px; margin:0; background:transparent; cursor:pointer; }
  .vol::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:linear-gradient(90deg, var(--accent) var(--p, 100%), #dfe2ee var(--p, 100%)); } .vol::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border-radius:50%; background:#fff; border:2px solid var(--accent); }
  .vol::-moz-range-track { height:4px; border-radius:2px; background:#dfe2ee; } .vol::-moz-range-progress { height:4px; border-radius:2px; background:var(--accent); } .vol::-moz-range-thumb { width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--accent); }
  .trk.muted .tt, .trk.muted .vic { opacity:.45; } .trk.muted .tt b { text-decoration:line-through; }
  .rs { position:absolute; left:8px; right:8px; bottom:-1px; height:8px; cursor:ns-resize; touch-action:none; z-index:2; } .rs::after { content:""; position:absolute; left:50%; bottom:2px; width:36px; height:3px; margin-left:-18px; border-radius:2px; background:#c3c8dc; opacity:0; } .trk:hover .rs::after, .rs:active::after { opacity:1; }
  #ln-track { position:relative; flex:1; cursor:col-resize; touch-action:none; }
  #ln-canvas { display:block; width:100%; }
  .menu button.danger { color:#d6453d; }
  #playhead, #playhead2 { position:absolute; top:0; bottom:0; left:0; width:0; pointer-events:none; }
  #playhead::before { content:""; position:absolute; left:-1px; top:12px; bottom:0; width:2px; background:var(--ink); }
  #playhead2::before { content:""; position:absolute; left:-1px; top:0; bottom:0; width:2px; background:var(--ink); }
  #playhead i { position:absolute; left:-6px; top:2px; width:12px; height:14px; border-radius:5px 5px 7px 7px; background:var(--ink); }
  #bstat { left:50%; top:12px; transform:translateX(-50%); font-weight:600; color:var(--ink); }
  #bstat a { color:var(--accent); cursor:pointer; }
  #credit { position:fixed; right:12px; bottom:calc(var(--tl, 150px) + 6px); font-size:10px; color:var(--muted); opacity:.75; pointer-events:none; text-shadow:0 0 3px #fff, 0 0 3px #fff; }
  #loading { left:50%; top:50%; transform:translate(-50%,-50%); font-size:14px; color:var(--ink); }
  #wash { position:fixed; inset:0; pointer-events:none; background:#e9ecf3; opacity:0; }
  #line { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  #pois { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .poi { position:absolute; left:0; top:0; width:0; height:0; will-change:transform; }
  .dot { position:absolute; left:-10px; top:-10px; width:20px; height:20px; box-sizing:border-box; border-radius:50%;
    background:#fff; border:5px solid var(--accent); pointer-events:auto; cursor:default; }
  .chip { position:absolute; left:0; bottom:20px; transform:translateX(-50%); padding:6px 12px; border-radius:12px;
    white-space:nowrap; font-size:13px; font-weight:600; background:rgba(255,253,249,.94);
    box-shadow:0 8px 24px rgba(31,43,120,.14), 0 1px 2px rgba(31,43,120,.10); opacity:0; transition:opacity .15s; }
  .chip::after { content:""; position:absolute; left:50%; bottom:-5px; width:10px; height:10px; background:inherit;
    transform:translateX(-50%) rotate(45deg); border-radius:2px; }
  .poi.show .chip { opacity:1; }
</style>
</head>

<div id="wash"></div>
<svg id="line"></svg>
<div id="pois"></div>

<div id="hud">
<div id="bench" role="toolbar" aria-label="Map tools">
  <a class="tg" href="../" title="Back to the demo overview" aria-label="Back to the demo overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>

<script>
// Modell laden: ?model=<id> aus dem Browser-Speicher (Wizard), sonst die Hamburg-Demo
window.CITY_READY = (async () => {
  const id = new URLSearchParams(location.search).get('model');
  if(id && id !== 'demo-hamburg'){
    const rec = await ModelStore.get(id);
    if(!rec) throw new Error('This model is not stored in this browser (anymore).');
    window.MODEL_REC = rec;   // für die Hintergrund-Berechnung der 3D-Karte (rec.build)
    return rec.city;
  }
  await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = '../data/hamburg-data.js'; s.onload = ok; s.onerror = () => fail(new Error('Demo data not found.')); document.head.appendChild(s); });
  window.CITY.meta.name = window.CITY.meta.name || 'Hamburg';
  return window.CITY;
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

let CITY;
try { CITY = await window.CITY_READY; }
catch(e){
  const el = document.getElementById('loading');
  el.textContent = e.message + ' '; const a = document.createElement('a'); a.href = 'index.html'; a.textContent = '← Back to models'; el.appendChild(a);
  throw e;
}
const HX = CITY.meta.hx, HZ = CITY.meta.hz;
document.title = (CITY.meta.name || 'Model') + ' · Route visualization';
document.getElementById('loading').textContent = `Building ${CITY.meta.name || 'model'} …`;


/* ---------- Grundlagen ---------- */
function mulberry32(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry32(11);
const R = (a,b) => a + (b-a)*rnd();
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const tick = () => new Promise(r => setTimeout(r));

const C = { bg:0xe9ecf3, tree:[0x74c68a,0x5fb877,0x8ad39b], trunk:0xb9a58c,
  car:[0xffffff,0x2b2f3d,0x1f2bff,0x7a8199,0x2b2f3d,0xffffff], glass:0xc9d1ea };
const matCache = new Map();
// Wetter und Tageszeit wirken über gemeinsame Uniforms auf Karte, Untergrund, Gebäude, Bäume und Fahrzeuge (nicht auf Auslastungsfarben, Linie und Beschriftungen)
const WX = {uSat:{value:1}, uCon:{value:1}, uTint:{value:new THREE.Vector3(1,1,1)}};
function applyWeather(mat, mute = false){

const MUTE = {sat:.32, mix:.22, k:[.93,.94,.97]};
function muted(hex){

  const o = [c.r,c.g,c.b].map((v,i) => (l + (v-l)*MUTE.sat)*(1-MUTE.mix) + MUTE.k[i]*MUTE.mix);
  return new THREE.Color().setRGB(o[0], o[1], o[2], THREE.LinearSRGBColorSpace);

/* ---------- Standardkarte (Rasterkacheln) unter und um die 3D-Fläche ---------- */
const TILE_URL = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;  // OSM-Standardkarte, 256 px (Prototyp; fürs Produkt eigener Kachelserver)
const [LAT0, LON0] = CITY.meta.center, KLAT = 110574, KLON = 111320*Math.cos(LAT0*Math.PI/180);  // dieselbe Projektion wie die Daten
const toLocal = (lat,lon) => [(lon-LON0)*KLON, -(lat-LAT0)*KLAT];
const fromLocal = (x,z) => [LAT0 - z/KLAT, LON0 + x/KLON];

const tileLat = (y,z) => 180/Math.PI*Math.atan(Math.sinh(Math.PI-2*Math.PI*y/2**z));
const lonToX = (lon,z) => Math.floor((lon+180)/360*2**z);
const latToY = (lat,z) => { const r = lat*Math.PI/180; return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z); };
const texLoader = new THREE.TextureLoader(); texLoader.setCrossOrigin('anonymous');
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const mapLayers = [{y:-1.2, tiles:new Map()}, {y:-.8, tiles:new Map()}];  // grob (immer da) und fein (je nach Zoom)
function tileMesh(z,x,y,yPos){
  const [xa,za] = toLocal(tileLat(y,z), tileLon(x,z)), [xb,zb] = toLocal(tileLat(y+1,z), tileLon(x+1,z));
  const geo = new THREE.PlaneGeometry(xb-xa, zb-za); geo.rotateX(-Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({color:0xffffff}), mesh = new THREE.Mesh(geo, mat);
  applyWeather(mat, true);
  mesh.position.set((xa+xb)/2, yPos, (za+zb)/2); mesh.visible = false; scene.add(mesh);
  texLoader.load(TILE_URL(z,x,y), t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; mat.map = t; mat.needsUpdate = true; mesh.visible = true; }, undefined, () => console.warn('Kachel fehlt', z, x, y));

}

    const [laN, loW] = fromLocal(b.x0, b.z0), [laS, loE] = fromLocal(b.x1, b.z1);
    const xa = lonToX(loW,z), xb = lonToX(loE,z), ya = latToY(laN,z), yb = latToY(laS,z);
    if((xb-xa+1)*(yb-ya+1) <= 120) for(let x=xa;x<=xb;x++) for(let y=ya;y<=yb;y++) want.add(`${z}/${x}/${y}`);
  }
  for(const [k,m] of layer.tiles) if(!want.has(k)){ dropTile(m); layer.tiles.delete(k); }
  for(const k of want) if(!layer.tiles.has(k)){ const [z_,x,y] = k.split('/').map(Number); layer.tiles.set(k, tileMesh(z_,x,y,layer.y)); }
}
function updateTiles(){
  let x0=1e9, x1=-1e9, z0=1e9, z1=-1e9;
  for(const [nx,ny] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    rayCaster.setFromCamera({x:nx, y:ny}, cam);
    // Schnitt der Geraden mit dem Boden (y = 0); bei der Orthokamera liegen die Strahlenanfänge unter dem Boden, "nach vorn" genügt nicht
    const o = rayCaster.ray.origin, d = rayCaster.ray.direction;
    hit.copy(o).addScaledVector(d, -o.y/d.y);
    x0=Math.min(x0,hit.x); x1=Math.max(x1,hit.x); z0=Math.min(z0,hit.z); z1=Math.max(z1,hit.z);
  }
  if(x0 > x1) return;
  const m = .08*Math.max(x1-x0, z1-z0), b = {x0:x0-m, x1:x1+m, z0:z0-m, z1:z1+m};
  const mpp = (2*FRUSTUM*aspect/cam.zoom)/innerWidth;                     // Meter pro Bildschirmpixel
  const zFine = Math.round(Math.log2(156543.03*Math.cos(LAT0*Math.PI/180)/mpp));  // 256-px-Kacheln
  syncLayer(mapLayers[0], 11, b);
  syncLayer(mapLayers[1], zFine > 11 ? Math.min(zFine, 19) : null, b);
}

const ring = f => { const v=[]; for(let i=0;i<f.length;i+=2) v.push(new THREE.Vector2(f[i], -f[i+1])); return v; };

        tertiary:[0xffffff,0x8f8f8f], unclassified:[0xffffff,0xbbbbbb], residential:[0xffffff,0xbbbbbb], living_street:[0xededed,0xbbbbbb],

const flatMats = [], flatMeshes = [];   // Untergrund blendet mit dem Zoom ein, weit draußen zeigt nur die Karte
let flatOrder = 1;
function flatMat(hex){ const m = applyWeather(new THREE.MeshBasicMaterial({color:muted(hex), transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide})); flatMats.push(m); return m; }
function flatAdd(geo, hex){ const m = new THREE.Mesh(geo, flatMat(hex)); m.renderOrder = flatOrder++; m.visible = false; m.receiveShadow = false; scene.add(m); flatMeshes.push(m); return m; }

/* Linienzug als flaches Band, Gelenke als kleine Scheiben */
function addRibbon(pos, pts, w, y){
  const hw = w/2, push = (x,z) => pos.push(x, y, z);
  for(let i=0;i+3<pts.length;i+=2){
    const x1=pts[i], z1=pts[i+1], x2=pts[i+2], z2=pts[i+3], dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
    if(len < .01) continue;
    const nx=-dz/len*hw, nz=dx/len*hw;
    push(x1+nx,z1+nz); push(x2-nx,z2-nz); push(x1-nx,z1-nz);
    push(x1+nx,z1+nz); push(x2+nx,z2+nz); push(x2-nx,z2-nz);
  }
  for(let i=2;i+2<pts.length;i+=2){
    const cx=pts[i], cz=pts[i+1];
    for(let k=0;k<8;k++){
      const a0=k/8*Math.PI*2, a1=(k+1)/8*Math.PI*2;
      push(cx,cz); push(cx+Math.cos(a0)*hw, cz+Math.sin(a0)*hw); push(cx+Math.cos(a1)*hw, cz+Math.sin(a1)*hw);
    }
  }
}
function ribbonMesh(pos, hex){
  if(!pos.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  const n = new Float32Array(pos.length); for(let i=1;i<n.length;i+=3) n[i]=1;
  g.setAttribute('normal', new THREE.BufferAttribute(n,3));
  flatAdd(g, hex);
}
const byKey = (arr, key) => { const m = new Map(); for(const x of arr){ const k = key(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };

function buildGround(){
  const base = new THREE.PlaneGeometry(2*HX, 2*HZ); base.rotateX(-Math.PI/2); base.translate(0,.01,0);
  flatAdd(base, OSM.land);
  for(const [k, items] of byKey(CITY.land || [], p => p.k)) flatPolys(items, OSM.landuse[k] ?? OSM.land, .02);
  for(const [k, items] of byKey(CITY.parks, p => p.k || 'grass')) flatPolys(items, OSM.green[k] ?? OSM.green.grass, .03);
  flatPolys(CITY.water, OSM.water, .04);
  { const pos = []; CITY.waterLines.forEach(l => addRibbon(pos, l.p, l.w, .04)); ribbonMesh(pos, OSM.water); }
  // Straßen: erst alle Ränder, dann alle Füllungen, jeweils nach Wichtigkeit, damit Kreuzungen sauber aussehen
  const roads = byKey(CITY.roads, r => r.c || 'residential');
  for(const c of ROAD_ORDER){ const items = roads.get(c); if(!items) continue;
    const pos = []; items.forEach(r => addRibbon(pos, r.p, r.w + 1.4, .06)); ribbonMesh(pos, (OSM.road[c] || OSM.road.residential)[1]); }
  for(const c of ROAD_ORDER){ const items = roads.get(c); if(!items) continue;
    const pos = []; items.forEach(r => addRibbon(pos, r.p, r.w, .08)); ribbonMesh(pos, (OSM.road[c] || OSM.road.residential)[0]); }
}

/* ---------- Aufbau ---------- */
const washEl = document.getElementById('wash');
const tall = [];  // Ebenen, die mit dem Zoom aus der Fläche in die Höhe wachsen
async function build(){
  buildGround();
  await tick();
  // Gebäude: ein zusammengefasstes Mesh, Farbe je Eckpunkt. Das Dach hat die Farbe des Gebäude-Fußabdrucks der Karte,
  // damit das Gebäude nahtlos aus der Karte herauswächst (Beleuchtung dämpft Flächen nach oben auf rund 0,92).
  const BLD_TOP = muted(OSM.building).multiplyScalar(1/.92), BLD_SIDE = BLD_TOP.clone().multiplyScalar(1.04);
  {
    // Kachelweise (1 km): jede Kachel ist ein eigenes Mesh. Die Grafikkarte zeichnet nur sichtbare Kacheln (Berlin: über 250.000 Gebäude),
    // und der Speicher wird nach jeder Kachel frei. Ein Modell ohne Gebäude (z. B. ohne 3D-Build) ist erlaubt.
    const TILE = 1000, buckets = new Map(), list = CITY.buildings;
    for(let i=0;i<list.length;i++){ const r = list[i].r, k = Math.floor(r[0]/TILE)*100000 + Math.floor(r[1]/TILE); (buckets.get(k) || buckets.set(k, []).get(k)).push(i); }
    const top = BLD_TOP, side = BLD_SIDE, mat = std(0xffffff, {vertexColors:true});
    for(const idxs of buckets.values()){
      const geos = [];
      for(const i of idxs){
        try {
          const g = new THREE.ExtrudeGeometry(shapeOf(list[i]), {depth:list[i].t, bevelEnabled:false});
          g.rotateX(-Math.PI/2);
          const nrm = g.attributes.normal, col = new Float32Array(nrm.count*3);
          for(let v=0; v<nrm.count; v++){ const c = nrm.getY(v) > .5 ? top : side; col[3*v]=c.r; col[3*v+1]=c.g; col[3*v+2]=c.b; }
          g.setAttribute('color', new THREE.BufferAttribute(col,3));

        } catch(e){}
      }
      if(geos.length){
        const merged = mergeGeometries(geos); geos.forEach(g => g.dispose());
        const m = new THREE.Mesh(merged, mat); m.castShadow = m.receiveShadow = true; scene.add(m); tall.push(m);
      }
      await tick();
    }
  }
  await tick();

  // Bäume: Straßenbäume aus den Daten, Grünflächen werden aufgefüllt
  {
    const trees = CITY.trees.length > 4000 ? CITY.trees.filter((_,i)=> i % Math.ceil(CITY.trees.length/4000) === 0) : CITY.trees.slice();
    const inside = (x,z,r) => { let c=false; for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){
      const xi=r[i],zi=r[i+1],xj=r[j],zj=r[j+1]; if((zi>z)!==(zj>z) && x < (xj-xi)*(z-zi)/(zj-zi)+xi) c=!c; } return c; };
    for(const p of CITY.parks){
      const r = p.r; let a=0; for(let i=0,j=r.length-2;i<r.length;j=i,i+=2) a += r[j]*r[i+1]-r[i]*r[j+1]; a = Math.abs(a)/2;
      let xs=[1e9,-1e9], zs=[1e9,-1e9]; for(let i=0;i<r.length;i+=2){ xs=[Math.min(xs[0],r[i]),Math.max(xs[1],r[i])]; zs=[Math.min(zs[0],r[i+1]),Math.max(zs[1],r[i+1])]; }
      let want = Math.min(a/200, 300), guard = 0;

    }

    const trunks = new THREE.InstancedMesh(trunkGeo, std(C.trunk), trees.length);
    const d = new THREE.Object3D(), col = new THREE.Color();
    trees.forEach(([x,z],i)=>{

    });

/* ---------- Verkehr: Modellrechnung (keine Messdaten) ---------- */
// Freie Geschwindigkeit (km/h) und Kapazität (Fz/h je Richtung) je Straßenklasse. Annahmen, später durch Visum oder Messwerte ersetzbar.
const ROADCLASS = {
  motorway:{v:80,cap:3600}, trunk:{v:60,cap:2400}, primary:{v:50,cap:1500}, secondary:{v:50,cap:1100},
  tertiary:{v:40,cap:800}, unclassified:{v:30,cap:600}, residential:{v:30,cap:400}, living_street:{v:10,cap:150} };
// Verlaufsfarben der Auslastung (polarisiert): kalt (blau) bis 10 %, optimal (grün), ab 65 % Warnung (gelb), ab 100 % Alarm (rot)
const LOAD_STOPS = [[0,0x3d5afe],[.10,0x1fb5c9],[.25,0x2fc66b],[.50,0x8ccf3a],[.65,0xf2d12b],[.85,0xf59a23],[1,0xe5322d],[1.25,0x9c0f2c]];
const LOAD_MAX = LOAD_STOPS[LOAD_STOPS.length-1][0];
const _c0 = new THREE.Color(), _c1 = new THREE.Color();
function loadColor(u, out = new THREE.Color()){
  u = Math.max(0, Math.min(LOAD_MAX, u));
  let i = 1; while(i < LOAD_STOPS.length-1 && u > LOAD_STOPS[i][0]) i++;
  const [ua, ca] = LOAD_STOPS[i-1], [ub, cb] = LOAD_STOPS[i];
  return out.copy(_c0.set(ca)).lerp(_c1.set(cb), (u-ua)/(ub-ua));
}

class Heap {  // Min-Heap für Dijkstra
  constructor(n){ this.k = new Float64Array(n); this.v = new Int32Array(n); this.size = 0; this.topK = 0; this.topV = 0; }
  push(k, v){ let i = this.size++; const K = this.k, V = this.v; while(i > 0){ const p = (i-1) >> 1; if(K[p] <= k) break; K[i] = K[p]; V[i] = V[p]; i = p; } K[i] = k; V[i] = v; }
  pop(){ const K = this.k, V = this.v; this.topK = K[0]; this.topV = V[0]; const k = K[--this.size], v = V[this.size]; let i = 0;
    for(;;){ let c = 2*i+1; if(c >= this.size) break; if(c+1 < this.size && K[c+1] < K[c]) c++; if(K[c] >= k) break; K[i] = K[c]; V[i] = V[c]; i = c; }
    K[i] = k; V[i] = v; }
}

async function buildTrafficModel(onProgress){
  // 1) Netz als gerichteter Graph
  const nid = new Map(), NX = [], NZ = [], out = [], eFrom = [], eTo = [], eLen = [], eCls = [], eW = [], segs = [];
  const node = (id,x,z) => { let i = nid.get(id); if(i === undefined){ i = NX.length; nid.set(id,i); NX.push(x); NZ.push(z); out.push([]); } return i; };
  const addEdge = (a,b,len,cls,w) => { const e = eFrom.length; eFrom.push(a); eTo.push(b); eLen.push(len); eCls.push(cls); eW.push(w); out[a].push(e); return e; };
  for(const r of CITY.roads){
    if(!r.d) continue;
    const cls = ROADCLASS[r.c] ? r.c : 'residential';
    for(let i=1;i<r.n.length;i++){
      const a = node(r.n[i-1], r.p[2*i-2], r.p[2*i-1]), b = node(r.n[i], r.p[2*i], r.p[2*i+1]);
      if(a === b) continue;
      const len = Math.hypot(NX[b]-NX[a], NZ[b]-NZ[a]); if(len < .5) continue;
      segs.push({e1:addEdge(a,b,len,cls,r.w), e2:addEdge(b,a,len,cls,r.w), a, b, w:r.w});
    }
  }
  const N = NX.length, M = eFrom.length;
  const vfree = new Float32Array(M), cap = new Float32Array(M), tcost = new Float32Array(M);
  for(let e=0;e<M;e++){ const c = ROADCLASS[eCls[e]]; vfree[e] = c.v/3.6; cap[e] = c.cap; tcost[e] = eLen[e]/vfree[e]; }

  // 2) Verkehrszellen: Gewicht = Geschossfläche der Gebäude (Fläche × Geschosse) in 250-m-Zellen
  const CELL = 250, gx = Math.ceil(2*HX/CELL), gz = Math.ceil(2*HZ/CELL), W = new Float64Array(gx*gz);
  for(const b of CITY.buildings){

  if(p){ controls.target.set(p.x, 0, p.z); cam.position.set(p.x-250, 195, p.z+250); }
  if(q.get('zoom')){ cam.zoom = +q.get('zoom'); cam.updateProjectionMatrix(); }
  if(q.get('t')){ const [h, m] = q.get('t').split(':').map(Number); sim.t = ((h*60) + (m || 0))*60; }
  if(q.has('pause')) setPlaying(false);
}
let model, overlay = null, cars = null;
function clear3D(){   // Untergrund, Gebäude, Bäume, Verkehr entfernen, damit sie aus neuen Daten neu aufgebaut werden können
  const objs = [...flatMeshes, ...tall, ...(overlay ? [overlay] : []), ...(cars ? [cars.group] : [])];
  overlay = cars = null;
  for(const o of objs){ scene.remove(o); o.traverse(x => { x.geometry && x.geometry.dispose(); }); }
  flatMeshes.length = 0; flatMats.length = 0; tall.length = 0;
}
async function make3D(progress){
  await build();
  model = await buildTrafficModel(p => progress(`Calculating traffic … ${Math.round(p*100)} %`));
  overlay = makeLoadOverlay(model); cars = makeCars(model);
}
const loadingEl = document.getElementById('loading');
await make3D(t => loadingEl.textContent = t);
loadingEl.remove();
layoutTimeline();

/* Schalter für Verkehr und Linien, dazu die Legende der Farbskala */
const show = {traffic:true, lines:true, labels:true, geom:geomReal, alerts:true, panel:false};
function applyToggles(){
  document.querySelectorAll('.tg[data-k]').forEach(b => { const on = show[b.dataset.k]; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  svg.style.display = poiHost.style.display = show.lines ? '' : 'none';
  viewDirty++; rpanel.hidden = !show.panel; saveLens();
  if(trafficOn !== show.traffic){ trafficOn = show.traffic; tlEl.classList.toggle('nt', !trafficOn); layoutTimeline(); }
  document.querySelector('.tg[data-k="geom"]').hidden = !LINES.some(L => L.src.g);
  if(show.geom !== geomReal){ geomReal = show.geom; applyGeom(); }
}
document.querySelectorAll('.tg[data-k]').forEach(b => b.addEventListener('click', () => { show[b.dataset.k] = !show[b.dataset.k]; applyToggles(); }));
/* ---------- Lenses ---------- */
// Eine Lens ist eine benannte Sicht auf das Netz: welche Ebenen an sind, welches Wetter und welcher Tag gilt. Später kommen weitere Teile dazu (zum Beispiel Kosten).
// Bis zu 10 Lenses. Taste 1 bis 9 und 0 wählt, Doppelklick benennt um (der Name steht im Tooltip), das × beim Überfahren oder die Entf-Taste löscht, + legt eine neue aus der aktuellen Ansicht an.
// Änderungen an Ebenen, Wetter oder Tag wirken sofort und werden in der aktiven Lens gespeichert. „Real route“, Panel und Zeitleistenhöhe gehören nicht dazu.
const LENS_KEY = 'rv-lenses2', LAYER_KEYS = ['traffic', 'lines', 'alerts', 'labels'], MAXL = 10, NUMKEYS = '1234567890';
const L_ALL = {traffic:true, lines:true, alerts:true, labels:true};
const DEFAULT_LENSES = () => [
  {name:'Overview', show:{...L_ALL}, wx:null, day:'weekdays'},
  {name:'Action', show:{traffic:false, lines:true, alerts:true, labels:false}, wx:null, day:'weekdays'},
  {name:'Rain day', show:{...L_ALL}, wx:'rain', day:'weekdays'},
  {name:'Clean', show:{traffic:false, lines:true, alerts:false, labels:false}, wx:null, day:'weekdays'}];
let lenses = DEFAULT_LENSES(), lensIx = 0, lensReady = false;
try { const st = JSON.parse(localStorage.getItem(LENS_KEY) || 'null'); if(st && Array.isArray(st.lenses) && st.lenses.length && st.lenses.length <= MAXL){ lenses = st.lenses; lensIx = Math.min(lenses.length - 1, Math.max(0, st.ix | 0)); } } catch(e){ /* Standard */ }
const lensBox = document.getElementById('lenses');
const PLUS_ICON = ic => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`, X_ICON = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg>';
function persistLens(){ try { localStorage.setItem(LENS_KEY, JSON.stringify({lenses, ix: lensIx})); } catch(e){ /* nur Komfort */ } }
function saveLens(){ if(!lensReady) return; const l = lenses[lensIx]; if(!l) return; for(const k of LAYER_KEYS) l.show[k] = !!show[k]; l.wx = wxForce; l.day = dayVal; persistLens(); }
function renderLenses(){
  lensBox.textContent = '';
  lenses.forEach((l, i) => {
    const w = document.createElement('div'); w.className = 'lw';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'slot' + (i === lensIx ? ' on' : ''); b.dataset.i = i; b.innerHTML = '<b></b>'; b.querySelector('b').textContent = (i + 1) % 10;
    b.setAttribute('aria-pressed', i === lensIx); b.setAttribute('aria-label', `Lens ${(i + 1) % 10}: ${l.name}`); b.title = `${l.name} (${(i + 1) % 10}). Double-click to rename, Delete removes it.`;
    w.append(b);
    if(lenses.length > 1){ const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.dataset.i = i; x.innerHTML = X_ICON; x.setAttribute('aria-label', `Delete lens ${l.name}`); x.title = 'Delete lens'; w.append(x); }
    lensBox.append(w);
  });
  if(lenses.length < MAXL){ const a = document.createElement('button'); a.type = 'button'; a.className = 'tg'; a.id = 'lens-add'; a.innerHTML = PLUS_ICON(); a.setAttribute('aria-label', 'Add a lens from the current view'); a.title = `Add a lens from the current view (${lenses.length} of ${MAXL})`; lensBox.append(a); }
}
function applyLens(i){
  const l = lenses[i]; if(!l) return;
  lensIx = i; lensReady = false;
  Object.assign(show, l.show); wxForce = l.wx || null; wxShown = ''; updateWxUi(); drawTimeline(); dayVal = l.day || 'weekdays'; updateDayUi();
  applyToggles(); lensReady = true; persistLens(); renderLenses();
}
function addLens(){ if(lenses.length >= MAXL) return; lenses.push({name:'Lens ' + (lenses.length + 1), show:Object.fromEntries(LAYER_KEYS.map(k => [k, !!show[k]])), wx:wxForce, day:dayVal}); applyLens(lenses.length - 1); }
function deleteLens(i){ if(lenses.length < 2) return; lenses.splice(i, 1); applyLens(Math.min(lensIx > i ? lensIx - 1 : lensIx, lenses.length - 1)); }
function renameLens(i, btn){
  const l = lenses[i]; if(!l) return; const m = document.createElement('div'), inp = document.createElement('input'); m.className = 'menu'; inp.type = 'text'; inp.value = l.name; inp.maxLength = 20; inp.setAttribute('aria-label', 'Lens name'); m.append(inp); document.body.appendChild(m);
  const r = btn.getBoundingClientRect(); m.style.left = r.left + 'px'; m.style.top = r.bottom + 6 + 'px';
  let done = false; const fin = ok => { if(done) return; done = true; if(ok && inp.value.trim()) l.name = inp.value.trim(); m.remove(); persistLens(); renderLenses(); };
  inp.focus(); inp.select(); inp.addEventListener('blur', () => fin(true)); inp.addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Enter') fin(true); if(e.key === 'Escape') fin(false); });
}
lensBox.addEventListener('click', e => {
  const x = e.target.closest('.x'); if(x){ deleteLens(+x.dataset.i); return; }
  if(e.target.closest('#lens-add')){ addLens(); return; }
  const b = e.target.closest('.slot'); if(b) applyLens(+b.dataset.i);
});
lensBox.addEventListener('dblclick', e => { const b = e.target.closest('.slot'); if(b) renameLens(+b.dataset.i, b); });
lensBox.addEventListener('keydown', e => { const b = e.target.closest('.slot'); if(b && (e.key === 'Delete' || e.key === 'Backspace')){ e.preventDefault(); deleteLens(+b.dataset.i); } });
// Tasten der Workbench von links nach rechts: Q W E R T (Ebenen), A (Tag), S (Wetter), D (Zeitleiste), F (Panel); 1 bis 9 und 0 wählen die Lens
addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase(), n = NUMKEYS.indexOf(k);
  if(n >= 0 && n < lenses.length){ applyLens(n); return; }
  const layer = {q:'traffic', w:'lines', e:'alerts', r:'labels', t:'geom', f:'panel'}[k];
  if(layer){ if(layer === 'geom' && !LINES.some(L => L.src.g)) return; show[layer] = !show[layer]; applyToggles(); }
  else if(k === 'a'){ e.preventDefault(); dayMenu.isOpen() ? dayMenu.close() : dayMenu.open(); }
  else if(k === 's'){ e.preventDefault(); wxMenu.isOpen() ? wxMenu.close() : wxMenu.open(); }
  else if(k === 'd') toggleTimeline();
});

/* ---------- Panel am rechten Rand ---------- */
// Vorbereitet: Rahmen mit Titel und Inhalt. Andere Teile befüllen ihn mit detailPanel.set(titel, element). Breite ziehbar, wird gemerkt.
const rpanel = document.getElementById('rpanel'), detailPanel = {set(title, node){ document.getElementById('rp-title').textContent = title; const b = document.getElementById('rp-body'); b.textContent = ''; b.append(node); show.panel = true; applyToggles(); }};
{ const grip = document.getElementById('rp-grip'), WK = 'rv-rpw'; let drag = null;
  const setW = (px, save = true) => { px = Math.round(Math.max(240, Math.min(innerWidth*.6, px))); document.documentElement.style.setProperty('--rpw', px + 'px'); if(save) try { localStorage.setItem(WK, px); } catch(e){ /* nur Komfort */ } };
  try { const v = +localStorage.getItem(WK); if(v) document.documentElement.style.setProperty('--rpw', Math.max(240, v) + 'px'); } catch(e){ /* Standard */ }
  grip.addEventListener('pointerdown', e => { drag = {x: e.clientX, w: rpanel.offsetWidth}; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove', e => { if(drag) setW(drag.w + drag.x - e.clientX); });
  grip.addEventListener('pointerup', () => { drag = null; }); grip.addEventListener('pointercancel', () => { drag = null; });
  grip.addEventListener('keydown', e => { if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); setW(rpanel.offsetWidth + (e.key === 'ArrowLeft' ? 40 : -40)); } }); }
applyLens(lensIx);
if(CITY.meta.credit) document.getElementById('credit').textContent = CITY.meta.credit;
if(CITY.meta.gaps && CITY.meta.gaps.length) document.getElementById('credit').textContent += ` · ${CITY.meta.gaps.length} tiles without data`;

/* ---------- 3D-Karte im Hintergrund: bis sie fertig ist, arbeitet der Viewer mit der 2D-Karte ---------- */
const bstat = document.getElementById('bstat');
const notes = {};   // Hinweise der laufenden Hintergrundarbeiten (3D-Karte, Ausrichtung der Linien) nebeneinander
function badge(html, key = '3d'){ if(html) notes[key] = html; else delete notes[key]; const t = Object.values(notes).join(' · '); bstat.hidden = !t; bstat.innerHTML = t; }
const api = (p, o) => fetch(p, o).then(async r => { const j = await r.json().catch(() => ({})); if(!r.ok) throw Object.assign(new Error(j.error || r.statusText), {status: r.status}); return j; });
const wait = ms => new Promise(r => setTimeout(r, ms));
const applyLineGeom = (geoms, qs) => { if(!geoms || !CITY.lines) return false; geoms.forEach((g, i) => { if(CITY.lines[i]){ if(g) CITY.lines[i].g = g; if(qs && qs[i] != null) CITY.lines[i].q = qs[i]; } }); CITY.meta.aligned = true; return true; };
let saving = Promise.resolve();   // Speichern nacheinander, damit sich 3D-Ergebnis und Ausrichtung nicht überschreiben
const saveRec = () => saving = saving.then(() => { const rec = window.MODEL_REC; rec.city = CITY; return ModelStore.put(rec).catch(() => {}); });   // an das Netz angelegte Linienformen
async function watchBuild(){
  const rec = window.MODEL_REC, B = rec && rec.build; if(!B || B.done) return;
  let misses = 0;
  for(;;){
    try {
      const j = await api('api/jobs/' + B.id, {cache: 'no-store'});
      misses = 0;
      if(j.status === 'running'){ const d = j.steps.filter(x => x.status === 'done' || x.status === 'failed').length; badge(`Building the 3D map in the background … ${d} of ${j.steps.length} sources`); await wait(2000); continue; }
      if(j.status === 'failed'){ badge('The 3D map could not be built: ' + (j.error || 'no source delivered data') + ' <a id="bretry">Retry</a>'); document.getElementById('bretry').onclick = () => { B.id = ''; watchBuild(); }; return; }
      badge('Adding the 3D map …');
      const res = await api(`api/jobs/${B.id}/result`);
      applyLineGeom(res.layers.lineGeom, res.layers.lineQ); delete res.layers.lineGeom; delete res.layers.lineQ;
      for(const k of Object.keys(res.layers)) CITY[k] = res.layers[k];
      if(res.credit) CITY.meta.credit = CITY.meta.source = res.credit;
      CITY.meta.gaps = [];
      clear3D(); await make3D(t => badge(t)); applyGeom();
      document.getElementById('credit').textContent = res.credit || document.getElementById('credit').textContent;
      B.done = true; rec.build = B; rec.city = CITY;
      rec.stats = {...rec.stats, buildings: CITY.buildings.length, roads: CITY.roads.length, water: CITY.water.length + CITY.waterLines.length, green: CITY.parks.length, trees: CITY.trees.length};
      await saveRec();
      badge(''); return;
    } catch(e){
      if(e.status === 404 && B.req && misses < 2){   // Server wurde neu gestartet: Auftrag erneut anlegen (die Zwischenspeicher machen das schnell)
        try { const j = await api('api/build', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(B.req)}); B.id = j.id; misses++; continue; } catch(e2){ e = e2; }
      }
      badge('The 3D map is not being built (' + (e.message || 'server not reachable') + '). Start <code>pipeline/server.py</code> and reload.'); return;
    }
  }
}
/* Modelle ohne ausgerichtete Linien (älter als die Ausrichtung oder ohne Linienformen im damaligen Auftrag): die Linien nachträglich auf die Straßen legen */
async function ensureAligned(){
  const rec = window.MODEL_REC; if(!rec || !CITY.lines || CITY.meta.aligned || !CITY.lines.some(l => l.g)) return;
  try {
    badge('Laying the lines on the road network …', 'align');
    const req = {center: CITY.meta.center, hx: CITY.meta.hx, hz: CITY.meta.hz, sources: ['overture-roads'], lines: CITY.lines.map(l => ({m: l.m, g: l.g || null}))};
    let j, id, res;
    for(let attempt = 0; ; attempt++){   // wurde der Server zwischendurch neu gestartet (404), den Auftrag erneut anlegen
      try {
        j = await api('api/build', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(req)}); id = j.id;
        do { await wait(1500); j = await api('api/jobs/' + id, {cache: 'no-store'}); } while(j.status === 'running');
        if(j.status !== 'done') throw new Error(j.error || 'failed');
        res = await api(`api/jobs/${id}/result`); break;
      } catch(e){ if(e.status !== 404 || attempt >= 2) throw e; }
    }
    const lens = CITY.lines.map(l => { let n = 0; const g = l.g || []; for(let i=2;i<g.length;i+=2) n += Math.hypot(g[i]-g[i-2], g[i+1]-g[i-1]); return n; });
    if(!applyLineGeom(res.layers.lineGeom, res.layers.lineQ)) CITY.meta.aligned = true;
    applyGeom();
    await saveRec();
    const qs = CITY.lines.map(l => l.q), tot = lens.reduce((a, b, i) => a + (qs[i] != null ? b : 0), 0), good = lens.reduce((a, b, i) => a + (qs[i] != null ? b * qs[i] : 0), 0);
    if(tot){ badge(`Lines: ${Math.round(100*good/tot)} % of the route length follows the road and rail network`, 'align'); setTimeout(() => badge('', 'align'), 9000); return; }
  } catch(e){ /* ohne Server bleibt die Linie, wie sie ist */ }
  badge('', 'align');
}
watchBuild(); ensureAligned();

/* Linien und Haltestellen hängen nur von der Kamera ab (nicht von der Zeit): nur neu berechnen, wenn sich die Ansicht ändert */
let lastLineKey = '', lastPoiKey = '';
const viewKey = () => [cam.zoom, cam.position.x, cam.position.y, cam.position.z, controls.target.x, controls.target.z, innerWidth, innerHeight, show.labels, show.lines, geomReal, viewDirty, Math.floor(sim.t/900)].join();
function updateLines(){ const k = viewKey(); if(k !== lastLineKey){ lastLineKey = k; placeLine(); } }
function updatePois(){ const k = viewKey(); if(k !== lastPoiKey){ lastPoiKey = k; placePois(); } }
const PERF = new URLSearchParams(location.search).has('perf'), perf = {n: 0, s: []};
const perfEl = document.createElement('div'); perfEl.className = 'pill'; perfEl.style.cssText = 'left:16px;top:64px;font:11px ui-monospace,Menlo,monospace;z-index:5'; if(PERF) document.body.appendChild(perfEl);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), lastTiles = 0, lastCars = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min((now-last)/1000, .05); last = now;
  // Zeit, Tagesgang und Wetter
  if(sim.playing && !sim.dragging) sim.t = (sim.t + dt*sim.speed) % 86400;
  const hNow = sim.t/3600, env = applyEnvironment(hNow), f = trafficAt(hNow);
  clockEl.textContent = clockText(sim.t); followPlayhead(); { const px = tvx(sim.t/3600, trackEl.clientWidth), vis = px >= -2 && px <= trackEl.clientWidth + 2; playheadEl.style.transform = `translateX(${px}px)`; playhead2.style.transform = `translateX(${tvx(sim.t/3600, lnTrack.clientWidth)}px)`; playheadEl.style.display = playhead2.style.display = vis ? '' : 'none'; } showWeather(env.w);
  stepCamTween(); controls.update();
  // weit draußen nur die Karte, nah dran wächst die Stadt aus ihr heraus (Adaptive Experience, kein sichtbarer Bereichsrand)
  const k = THREE.MathUtils.smoothstep(cam.zoom, .12, .45);
  tall.forEach(m => { m.visible = k > .02; m.scale.y = Math.max(k, .001); });
  // Verkehr: weit draußen Farbe der Auslastung, nah dran Fahrzeuge in passender Zahl
  if(overlay) overlay.visible = show.traffic;
  if(overlay && show.traffic){
    overlay.material.uniforms.uMpp.value = (2*FRUSTUM*aspect/cam.zoom)/innerWidth;
    overlay.material.uniforms.uOpacity.value = .35 + .65*(1 - THREE.MathUtils.smoothstep(cam.zoom, .25, .7));
    overlay.material.uniforms.uScale.value = f;
  }
  const carsOn = !!cars && show.traffic && cam.zoom > .2;
  if(cars) cars.group.visible = carsOn;
  if(carsOn){
    if(now - lastCars > 400){
      lastCars = now; cars.rebalance(controls.target.x, controls.target.z, Math.min(2600, FRUSTUM/cam.zoom*1.6), f);
    }
    cars.update(calm ? 0 : dt, THREE.MathUtils.clamp(1.6/cam.zoom, 1, 4), f, Math.min(.4, env.shadowOpacity*1.6));
  }
  const fg = THREE.MathUtils.smoothstep(cam.zoom, .08, .25);   // eigener Untergrund blendet über der Karte ein
  flatMats.forEach(m => m.opacity = fg); flatMeshes.forEach(m => m.visible = fg > .01);
  washEl.style.opacity = .45*(1-k);  // weit draußen tritt die Linie vor der Karte hervor
  if(now - lastTiles > 300){ lastTiles = now; updateTiles(); }
  if(PERF){   // ?perf: Zeit je Teil und Bild (gleitender Mittelwert), um Engpässe großer Städte zu finden
    const tm = []; const T = f => { const t = performance.now(); f(); tm.push(performance.now() - t); };
    T(() => updateSun(controls.target)); T(updateLines); T(() => placeTrains(sim.t)); T(updatePois); T(() => renderer.render(scene, cam));
    perf.n++; tm.forEach((v, i) => perf.s[i] = (perf.s[i] || 0)*.9 + v*.1);
    if(perf.n % 30 === 0) perfEl.textContent = `ms/frame  sun ${perf.s[0].toFixed(1)} · lines ${perf.s[1].toFixed(1)} · trains ${perf.s[2].toFixed(1)} · stops ${perf.s[3].toFixed(1)} · render ${perf.s[4].toFixed(1)} · trips ${TRIPS.length} · buildings ${CITY.buildings.length}`;
  } else { updateSun(controls.target); updateLines(); placeTrains(sim.t); updatePois(); renderer.render(scene, cam); }
});
